async function api(body){if(!/^https:\/\/script\.google\.com\//.test(API_URL))throw new Error('Web App URL is not set yet. Paste it in API_URL at the top of the script.');const res=await fetch(body?API_URL:API_URL+'?t='+Date.now(),body?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}:{});const j=await res.json();if(!j.ok)throw new Error(j.error||'Request failed');return j}
const $=id=>document.getElementById(id);let dataset=[];function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pct(n,d){return d?Math.round(n/d*100)+'%':'0%'}
function reload(){$('error').textContent='';api().then(j=>{const map=new Map(j.responses.map(r=>[r.key,r]));dataset=STORES.map(s=>{const a=map.get(s.key)||null;return {...s,status:a?'Completed':'Pending',response:a}});const current=$('dealer').value;const ds=[...new Set(dataset.map(r=>r.dealer))].sort();$('dealer').innerHTML='<option value="">All Dealers</option>'+ds.map(d=>'<option value="'+safe(d)+'">'+safe(d)+'</option>').join('');$('dealer').value=current;render();$('updated').textContent='Last refreshed '+new Date().toLocaleString();}).catch(e=>$('error').textContent=e.message||String(e))}
function filtered(){const d=$('dealer').value,s=$('status').value,q=$('search').value.trim().toLowerCase();return dataset.filter(r=>(!d||r.dealer===d)&&(!s||r.status===s)&&(!q||[r.dealer,r.name,r.code,r.key].join(' ').toLowerCase().includes(q)))}
function render(){const all=filtered(),done=all.filter(r=>r.status==='Completed').length;$('total').textContent=all.length;$('completed').textContent=done;$('pending').textContent=all.length-done;$('rate').textContent=pct(done,all.length);$('count').textContent=all.length+' stores in current filter';const groups={};all.forEach(r=>{const g=groups[r.dealer]??={total:0,done:0};g.total++;if(r.status==='Completed')g.done++});$('dealers').innerHTML=Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).map(([d,g])=>'<tr><td>'+safe(d)+'</td><td>'+g.total+'</td><td>'+g.done+'</td><td>'+(g.total-g.done)+'</td><td><div class="progress"><div style="width:'+pct(g.done,g.total)+'"></div></div><span class="small">'+pct(g.done,g.total)+'</span></td></tr>').join('')||'<tr><td colspan="5">No results</td></tr>';
$('stores').innerHTML=all.map(r=>{const a=r.response;const detail=a?'<details><summary>View answers</summary><p>Same Floor: '+safe(a.sameFloor)+'</p><p>Visible: '+safe(a.visible)+'</p><p>Refrigerator: '+safe(a.refSteps)+' steps / '+safe(a.refMeters)+' m</p><p>Washing Machine: '+safe(a.wmSteps)+' steps / '+safe(a.wmMeters)+' m</p><p>AC: '+safe(a.acSteps)+' steps / '+safe(a.acMeters)+' m</p><p>Floors — AV: '+safe(a.av)+' | HA: '+safe(a.ha)+' | AC: '+safe(a.ac)+'</p><p>Submission ID: '+safe(a.id)+'</p></details>':'—';return '<tr><td><b>'+safe(r.dealer)+'</b><br>'+safe(r.name)+'</td><td>'+safe(r.code)+'<br><span class="small muted">'+safe(r.key)+'</span></td><td><span class="pill '+(r.status==='Completed'?'done':'')+'">'+safe(r.status)+'</span></td><td>'+safe(a?.timestamp||'—')+'</td><td>'+detail+'</td></tr>'}).join('')||'<tr><td colspan="5">No results</td></tr>'}
function exportCSV(){const headers=['Store Key','Dealer','MCS Code','Store Name','Status','Timestamp','Same Floor','Visible','Refrigerator Steps','Refrigerator Meters','Washing Machine Steps','Washing Machine Meters','AC Steps','AC Meters','AV Floor','HA Floor','AC Floor','Submission ID'];const rows=filtered().map(r=>{const a=r.response||{};return [r.key,r.dealer,r.code,r.name,r.status,a.timestamp,a.sameFloor,a.visible,a.refSteps,a.refMeters,a.wmSteps,a.wmMeters,a.acSteps,a.acMeters,a.av,a.ha,a.ac,a.id]});const csv=[headers,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='CE_SURVEY_FILTERED_'+new Date().toISOString().slice(0,10)+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
['dealer','status','search'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));reload();setInterval(reload,60000);
